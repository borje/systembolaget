[project]
name = "systembolaget"
version = "0.1.0"
description = "CLI for searching Systembolaget's product catalogue via their public REST API"
readme = "README.md"
authors = [{ name = "Borje Granberg" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
sb = "systembolaget.cli:app"
vivino = "systembolaget.vivino_cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.16",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
